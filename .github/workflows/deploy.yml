name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Type-checks src/services/cv against lib ES2020 with no DOM at all, so
      # reintroducing a `document`, `canvas` or `ImageData` reference into the
      # shared CV core fails the build here rather than at a competition, when
      # the Node worker turns out not to start.
      - name: Check the CV core is still DOM-free
        run: npm run worker:check

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_TBA_API_KEY: ${{ secrets.TBA_API_KEY }}

      - name: Add SPA 404 fallback
        run: |
          if [ -f ./dist/index.html ]; then
            cp ./dist/index.html ./dist/404.html
            echo "Created dist/404.html from dist/index.html"
          else
            echo "dist/index.html not found"
            exit 1
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
